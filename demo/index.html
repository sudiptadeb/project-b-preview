<link rel="icon" href="icon-small.svg" type="image/svg+xml">
<!-- The first bytes paint the page: white, or black in dark mode, before anything loads. -->
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: #fff; }
  @media (prefers-color-scheme: dark) { html, body { background: #000; } }
</style>
<link rel="preload" href="core.wasm" as="fetch" type="application/wasm" crossorigin>
<link rel="stylesheet" href="stage.css">
<script src="fs.js"></script>
<script src="wasm_exec.js"></script>
<script>
  // The core starts at once, while the intro plays. The visitor's OS is what the core
  // reads as it starts (core/cmd/webdemo): a phone's app on Android, the Mac's keys on a
  // Mac, Linux's on any other.
  (() => {
    const ua = navigator.userAgent;
    // A phone, iPhones too (whose user agent also says Mac OS X), or any narrow screen, gets
    // the phone's app, as stage.js gives it the phone's stage.
    globalThis.pbcoreOS = /Android|iPhone|iPod/.test(ua) || innerWidth < 640 ? 'android' : /Macintosh|Mac OS X/.test(ua) ? 'mac' : 'linux';
    const t0 = performance.now();
    globalThis.pbcoreStarted = new Promise((ready, failed) => {
      globalThis.pbcoreReady = () => {
        globalThis.pbcoreStartMs = Math.round(performance.now() - t0);
        ready();
      };
      const go = new Go();
      // The core's size as built (build.sh writes it in), and how much of it has come, for
      // the intro to say while it waits.
      globalThis.pbcoreTotal = Number('32589792') || 0;
      globalThis.pbcoreBytes = 0;
      fetch('core.wasm', { credentials: 'same-origin' })
        .then((res) => {
          if (!res.ok) throw new Error('core.wasm: ' + res.status);
          const reader = res.body.getReader();
          const counted = new ReadableStream({
            async pull(c) {
              const { done, value } = await reader.read();
              if (done) { c.close(); return; }
              globalThis.pbcoreBytes += value.byteLength;
              c.enqueue(value);
            },
          });
          return WebAssembly.instantiateStreaming(new Response(counted, { headers: { 'Content-Type': 'application/wasm' } }), go.importObject);
        })
        .then((r) => go.run(r.instance))
        .catch(failed);
    });
  })();
</script>
</head>
