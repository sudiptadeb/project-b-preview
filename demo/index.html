<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project B, in your browser</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; background: #fff; }
  @media (prefers-color-scheme: dark) { html, body { background: #000; } }
  #status { position: fixed; inset: 0; display: grid; place-items: center; font: 15px system-ui, sans-serif; color: #5c6270; }
  #window { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
</style>
<script src="fs.js"></script>
<script src="wasm_exec.js"></script>
</head>
<body>
<div id="status">Starting Project B…</div>
<iframe id="window" title="Project B"></iframe>
<script>
  // The core starts here, in this page, and the window page and every page it holds speak
  // to it through shim.js.
  const status = document.getElementById('status');
  const frame = document.getElementById('window');
  const t0 = performance.now();
  globalThis.pbcoreReady = () => {
    globalThis.pbcoreStartMs = Math.round(performance.now() - t0);
    console.log('pbcore ready in', globalThis.pbcoreStartMs, 'ms');
    status.remove();
    frame.style.display = 'block';
    frame.src = 'window.html' + location.search;
  };
  // The visitor's OS, which the core reads as it starts (core/cmd/webdemo).
  const ua = navigator.userAgent;
  globalThis.pbcoreOS = /Android/.test(ua) ? 'android' : /Macintosh|Mac OS X/.test(ua) ? 'mac' : 'linux';
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch('core.wasm'), go.importObject)
    .then((r) => go.run(r.instance))
    .catch((e) => { status.textContent = 'Project B could not start: ' + e; console.error(e); });
</script>
</body>
</html>
